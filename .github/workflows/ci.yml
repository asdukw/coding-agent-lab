name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check style
        run: bun run check:style

      - name: Check types
        run: bun run check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run offline tests
        run: bun run test:unit

  offline-demo:
    name: Offline demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic offline demo
        id: offline_demo
        continue-on-error: true
        env:
          CAGENT_DEMO_REPORT_DIR: ${{ runner.temp }}/coding-agent-lab-offline-demo
        run: bun run demo:offline

      - name: Upload sanitized demo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-demo-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coding-agent-lab-offline-demo/offline-demo.json
            ${{ runner.temp }}/coding-agent-lab-offline-demo/offline-demo.md
          if-no-files-found: error
          retention-days: 14

      - name: Propagate offline demo failure
        if: always() && steps.offline_demo.outcome == 'failure'
        run: exit 1

  windows-sandbox-runner:
    name: Windows sandbox runner (Rust)
    # The trusted build script intentionally targets Visual Studio 2022.
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      # Keep this synchronized with rust-toolchain.toml and the build script.
      RUST_TOOLCHAIN: 1.96.0-x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install $env:RUST_TOOLCHAIN
          --profile minimal
          --component rustfmt
          --component clippy
          --target x86_64-pc-windows-msvc

      - name: Check Rust formatting
        working-directory: native/windows-sandbox-runner
        run: rustup run $env:RUST_TOOLCHAIN cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: native/windows-sandbox-runner
        run: rustup run $env:RUST_TOOLCHAIN cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        working-directory: native/windows-sandbox-runner
        run: rustup run $env:RUST_TOOLCHAIN cargo test --locked

      - name: Build release runner
        run: |
          $cargoTargetDir = Join-Path $env:RUNNER_TEMP "cagent-windows-sandbox-runner-target"
          .\scripts\build-windows-sandbox.ps1 -CargoTargetDir $cargoTargetDir

          $runnerPath = Join-Path $cargoTargetDir "x86_64-pc-windows-msvc\release\cagent-windows-sandbox-runner.exe"
          if (-not (Test-Path -LiteralPath $runnerPath -PathType Leaf)) {
            throw "Expected release runner was not produced: $runnerPath"
          }
          "CAGENT_WINDOWS_SANDBOX_HELPER=$runnerPath" >> $env:GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test release runner end to end
        env:
          CAGENT_WINDOWS_SANDBOX_INTEGRATION: "1"
        run: bun run test:sandbox
